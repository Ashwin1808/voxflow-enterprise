server:
  port: ${SERVER_PORT:8087}
spring:
  application:
    name: outbound-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8089/realms/voxflow-realm}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /api-docs
voxflow:
  call:
    provider: ${CALL_PROVIDER:emulator}
    public-base-url: ${PUBLIC_BASE_URL:}
    emulator:
      answer-rate: ${EMULATOR_ANSWER_RATE:0.75}
      min-ring-seconds: ${EMULATOR_MIN_RING_SECONDS:2}
      max-ring-seconds: ${EMULATOR_MAX_RING_SECONDS:8}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
      poll-interval-seconds: ${TWILIO_POLL_INTERVAL_SECONDS:5}
    exotel:
      account-sid: ${EXOTEL_ACCOUNT_SID:}
      api-key: ${EXOTEL_API_KEY:}
      api-token: ${EXOTEL_API_TOKEN:}
      from-number: ${EXOTEL_FROM_NUMBER:}
      poll-interval-seconds: ${EXOTEL_POLL_INTERVAL_SECONDS:5}