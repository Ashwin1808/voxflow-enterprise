server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fraud service API (campaigns, sessions, decisions, visual IVR)
    location /api/v1/fraud/ {
        proxy_pass http://fraud-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Outbound dialer API
    location /api/v1/outbound/ {
        proxy_pass http://outbound-service:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Customer-facing Visual IVR app (visapp-style SPA, hash-routed)
    location /v/ {
        root /usr/share/nginx/html;
        try_files $uri /v/index.html;
    }

    # Customer-facing Visual IVR API
    location /public/ {
        proxy_pass http://fraud-service:8082;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}