name: CI — Build, Test & Scan

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java services (JDK 21)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, fraud-service, insurance-service, inbound-service, provider-service, analytics-service, outbound-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build + test
        run: mvn -B -pl services/${{ matrix.service }} -am verify -DskipITs
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: services/${{ matrix.service }}
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          ignore-unfixed: true

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          ignore-unfixed: true

  docker:
    name: Container build + image scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          for s in auth-service fraud-service insurance-service inbound-service provider-service analytics-service outbound-service; do
            docker build -f infra/Dockerfile.service --build-arg SERVICE=$s -t voxflow/$s:ci . &
          done
          docker build -f infra/Dockerfile.frontend -t voxflow/frontend:ci . &
          wait
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          scan-ref: "voxflow/fraud-service:ci"
          severity: CRITICAL
          format: table
          exit-code: "1"
          ignore-unfixed: true
