name: CD — Publish & Deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/voxflow

jobs:
  publish:
    name: Build & publish images to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push java services
        run: |
          set -e
          TAG=${{ github.ref_name }}
          for s in auth-service fraud-service insurance-service inbound-service provider-service analytics-service outbound-service; do
            docker build -f infra/Dockerfile.service --build-arg SERVICE=$s -t ${REGISTRY}/${IMAGE_PREFIX}-$s:$TAG -t ${REGISTRY}/${IMAGE_PREFIX}-$s:latest .
            docker push ${REGISTRY}/${IMAGE_PREFIX}-$s:$TAG
            docker push ${REGISTRY}/${IMAGE_PREFIX}-$s:latest
          done
      - name: Build & push frontend
        run: |
          TAG=${{ github.ref_name }}
          docker build -f infra/Dockerfile.frontend -t ${REGISTRY}/${IMAGE_PREFIX}-frontend:$TAG -t ${REGISTRY}/${IMAGE_PREFIX}-frontend:latest .
          docker push ${REGISTRY}/${IMAGE_PREFIX}-frontend:$TAG
          docker push ${REGISTRY}/${IMAGE_PREFIX}-frontend:latest
